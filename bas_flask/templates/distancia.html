{% extends "layout.html" %}

{% block container %}
<h2>Cálculo de Distancia entre dos Puntos</h2>

<form action="/distancia" method="post" class="mt-3">
    <div class="row mb-3">
        <div class="col-md-6">
            <h4>Punto 1 (X1, Y1)</h4>
            <label for="x1" class="form-label">X1:</label>
            <input type="number" step="any" class="form-control mb-2" id="x1" name="x1" value="{{ x1 }}">
            <label for="y1" class="form-label">Y1:</label>
            <input type="number" step="any" class="form-control" id="y1" name="y1" value="{{ y1 }}">
        </div>
        <div class="col-md-6">
            <h4>Punto 2 (X2, Y2)</h4>
            <label for="x2" class="form-label">X2:</label>
            <input type="number" step="any" class="form-control mb-2" id="x2" name="x2" value="{{ x2 }}">
            <label for="y2" class="form-label">Y2:</label>
            <input type="number" step="any" class="form-control" id="y2" name="y2" value="{{ y2 }}">
        </div>
    </div>

    <button type="submit" class="btn btn-primary">Calcular Distancia</button>
</form>

<h1 class="mt-4">
    La distancia es: {{ "%.2f"|format(res_distancia|float) }}
</h1>
{% endblock %}
